<!doctype html>
<meta charset="utf-8">
<title>F54 pending</title>
<style>
  html, body { background: #10131c; color: #e8eefc; font: 14px monospace; }
  canvas { width: 128px; height: 128px; border: 1px solid #66ccff; margin: 8px; }
  pre { white-space: pre-wrap; }
</style>
<h1>F54 Firefox G17P offline WebGL gate</h1>
<div id="canvases"></div><pre id="result">running</pre>
<script>
"use strict";

function compile(gl, type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
    const log = gl.getShaderInfoLog(shader);
    gl.deleteShader(shader);
    throw new Error("shader compile: " + log);
  }
  return shader;
}

function program(gl, vertex, fragment, label) {
  const vs = compile(gl, gl.VERTEX_SHADER, vertex);
  const fs = compile(gl, gl.FRAGMENT_SHADER, fragment);
  const p = gl.createProgram();
  gl.attachShader(p, vs);
  gl.attachShader(p, fs);
  gl.bindAttribLocation(p, 0, "position");
  gl.linkProgram(p);
  gl.deleteShader(vs);
  gl.deleteShader(fs);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    const log = gl.getProgramInfoLog(p);
    gl.deleteProgram(p);
    throw new Error(label + " link: " + log);
  }
  return p;
}

function context(kind) {
  const canvas = document.createElement("canvas");
  canvas.width = 16;
  canvas.height = 16;
  document.getElementById("canvases").appendChild(canvas);
  const gl = canvas.getContext(kind, {
    antialias: false, alpha: true, depth: false, stencil: false,
    preserveDrawingBuffer: true, failIfMajorPerformanceCaveat: true
  });
  if (!gl) throw new Error(kind + " context unavailable");
  return gl;
}

function geometry(gl) {
  const vbo = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.bufferData(gl.ARRAY_BUFFER,
    new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  const ibo = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array([2, 0, 1]),
                gl.STATIC_DRAW);
  return {vbo, ibo};
}

function readExact(gl, expected) {
  gl.finish();
  const pixel = new Uint8Array(4);
  gl.readPixels(8, 8, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixel);
  const error = gl.getError();
  return {pixel: Array.from(pixel), expected, glError: error,
          exact: error === gl.NO_ERROR &&
            expected.every((value, index) => value === pixel[index])};
}

const WEBGL1_VS = `
  attribute vec2 position;
  uniform vec4 tint;
  varying vec4 colour;
  void main() {
    gl_Position=vec4(position,0.0,1.0);
    int signedValue=int(position.x*8.0);
    float keep=signedValue < 32768 ? 1.0 : 0.0;
    colour=tint*keep;
  }`;
const WEBGL1_FS = `
  precision highp float;
  varying vec4 colour;
  void main() {
    if (colour.a < 0.5) discard;
    gl_FragColor=colour;
  }`;
const WEBGL2_VS = `#version 300 es
  layout(location=0) in vec2 position;
  uniform highp sampler2D source;
  flat out highp vec4 sampled;
  void main() {
    gl_Position=vec4(position,0.0,1.0);
    int id=gl_VertexID;
    ivec2 tc=ivec2((id*3+2)&3,(id*2+1)&3);
    vec4 a=texelFetch(source,tc,0);
    vec4 b=textureLod(source,(vec2(tc)+0.5)/4.0,0.0);
    sampled=(a+b)*0.5;
  }`;
const WEBGL2_FS = `#version 300 es
  precision highp float;
  precision highp int;
  flat in highp vec4 sampled;
  layout(location=0) out vec4 colour;
  void main() {
    uint lane=(uint(gl_FragCoord.x)^uint(gl_FragCoord.y))&1u;
    if (sampled.a < 0.5) discard;
    colour=sampled+vec4(float(lane)*0.0);
  }`;

function provenance(gl) {
  const debug = gl.getExtension("WEBGL_debug_renderer_info");
  return {
    version: gl.getParameter(gl.VERSION),
    shadingLanguageVersion: gl.getParameter(gl.SHADING_LANGUAGE_VERSION),
    vendor: gl.getParameter(gl.VENDOR),
    renderer: gl.getParameter(gl.RENDERER),
    unmaskedVendor: debug ? gl.getParameter(debug.UNMASKED_VENDOR_WEBGL) : null,
    unmaskedRenderer: debug ? gl.getParameter(debug.UNMASKED_RENDERER_WEBGL) : null
  };
}

function runWebGL1() {
  const gl = context("webgl");
  const p = program(gl, WEBGL1_VS, WEBGL1_FS, "WebGL1 baseline");
  const buffers = geometry(gl);
  gl.useProgram(p);
  gl.uniform4f(gl.getUniformLocation(p, "tint"), 64/255, 128/255, 192/255, 1);
  gl.viewport(0, 0, 16, 16);
  gl.drawElements(gl.TRIANGLES, 3, gl.UNSIGNED_SHORT, 0);
  const exact = readExact(gl, [64, 128, 192, 255]);
  gl.deleteBuffer(buffers.ibo);
  gl.deleteBuffer(buffers.vbo);
  gl.deleteProgram(p);
  return {...provenance(gl), ...exact};
}

function runWebGL2() {
  const gl = context("webgl2");
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  const buffers = geometry(gl);
  const expected = [17, 123, 201, 255];
  const texels = new Uint8Array(4 * 4 * 4);
  for (let i = 0; i < 16; ++i) {
    texels[4*i] = 3 + i*7;
    texels[4*i+1] = 9 + i*5;
    texels[4*i+2] = 211 - i*3;
    texels[4*i+3] = 255;
  }
  for (const index of [1*4+2, 3*4+1, 1*4+0])
    texels.set(expected, 4*index);
  const texture = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, texture);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, 4, 4, 0, gl.RGBA,
                gl.UNSIGNED_BYTE, texels);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const retained = program(gl, WEBGL2_VS, WEBGL2_FS, "WebGL2 retained");
  gl.useProgram(retained);
  gl.uniform1i(gl.getUniformLocation(retained, "source"), 0);
  gl.viewport(0, 0, 16, 16);
  const draws = [];
  for (let iteration = 0; iteration < 12; ++iteration) {
    const temporary = program(gl, WEBGL2_VS, WEBGL2_FS,
                              "WebGL2 compiler churn " + iteration);
    gl.deleteProgram(temporary);
    gl.useProgram(retained);
    gl.drawElements(gl.TRIANGLES, 3, gl.UNSIGNED_SHORT, 0);
    draws.push(readExact(gl, expected));
  }
  gl.deleteProgram(retained);
  gl.deleteTexture(texture);
  gl.deleteBuffer(buffers.ibo);
  gl.deleteBuffer(buffers.vbo);
  gl.deleteVertexArray(vao);
  return {...provenance(gl), draws,
          exact: draws.length === 12 && draws.every(draw => draw.exact)};
}

window.__f54ResultPromise = Promise.resolve().then(() => {
  const result = {schema: 1, webgl1: runWebGL1(), webgl2: runWebGL2()};
  result.ok = result.webgl1.exact && result.webgl2.exact;
  return result;
}).catch(error => ({schema: 1, ok: false, error: String(error),
                    stack: String(error && error.stack || "")}));

window.__f54ResultPromise.then(result => {
  const json = JSON.stringify(result, null, 2);
  document.getElementById("result").textContent = json;
  document.title = result.ok ? "F54 PASS" : "F54 FAIL";
});
</script>
